# config/stages.yml — Phase model
#
# This project's lifecycle stages. Each entry maps 1:1 to a GitHub
# Milestone (created automatically by scripts/sync_milestones.py
# during Pass 1 setup, or by you on the Milestones tab).
#
# `pr_rollup.py` closes the milestone when all its `user_needs`
# transition to status: verified.
#
# Schema:
#   stages:
#     <stage-number>:
#       title: <full milestone title, "Stage N — <name>">
#       user_needs: [<list of UN-IDs to be completed in this stage>]
#       exit_criteria: <one-line summary, optional>
#
# Three example presets below. UNCOMMENT the one that fits your
# lifecycle; delete or comment-out the others.

# ============================================================================
# PRESET A — Software project (fast iteration, no hardware gates)
# ============================================================================
stages:
  1:
    title: "Stage 1 — Scaffold & Foundation"
    user_needs: [UN-001, UN-002]
    exit_criteria: project structure in place, all agents discoverable

  2:
    title: "Stage 2 — Core Engine"
    user_needs: []
    exit_criteria: primary functionality demonstrable on fixtures

  3:
    title: "Stage 3 — Integration"
    user_needs: []
    exit_criteria: end-to-end pipeline runs on real inputs

  4:
    title: "Stage 4 — V&V"
    user_needs: []
    exit_criteria: all KPMs measured, all user needs validated

  5:
    title: "Stage 5 — Release"
    user_needs: []
    exit_criteria: production deploy + monitoring in place

