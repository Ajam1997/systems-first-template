name: Publish Dev Docs to Wiki

# Auto-publishes dev-docs/ to the GitHub Wiki on push to main.
# Chains after regen-docs.yml via workflow_run so the wiki always
# reflects the latest AUTO-regenerated state, not a stale snapshot.
#
# Auth: requires a **classic** Personal Access Token with the `repo`
# scope, stored as the `WIKI_PUSH_TOKEN` secret. Fine-grained PATs do
# NOT support wiki write access — they fail with HTTP 403. Default
# GITHUB_TOKEN also cannot push to the wiki repo.
#
# Setup checklist:
#   1. GitHub → Settings → Developer settings → Personal access tokens →
#      Tokens (classic) → Generate new token (classic)
#      - Note: "<your-repo-name> wiki push"
#      - Scope: `repo` (full control of private repositories; the
#        narrowest scope that includes wiki write on a private repo).
#      - Expiration: 1 year recommended.
#   2. Copy the token (only shown once).
#   3. Repo → Settings → Secrets and variables → Actions →
#      New repository secret
#      Name: WIKI_PUSH_TOKEN
#      Value: (paste token)
#   4. Trigger this workflow manually (Actions tab → Publish Dev Docs
#      to Wiki → Run workflow) to verify auth.

on:
  workflow_run:
    workflows: ["Regenerate Docs from Issues"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "dev-docs/**"
      - ".github/workflows/wiki-publish.yml"
  workflow_dispatch:

# Prevent overlapping wiki pushes — two PRs merged back-to-back must serialize.
concurrency:
  group: wiki-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skip if the upstream regen workflow failed (workflow_run only)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Wiki publishing is OPT-IN: without the secret this job is a green
      # no-op, so freshly instantiated projects aren't red-X'd until they
      # decide they want a wiki.
      - name: Check whether WIKI_PUSH_TOKEN is configured
        id: token
        env:
          WIKI_PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
        run: |
          if [ -z "$WIKI_PUSH_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WIKI_PUSH_TOKEN secret is not set — skipping wiki publish. See the setup checklist in this workflow file to enable it."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "WIKI_PUSH_TOKEN is set (length: ${#WIKI_PUSH_TOKEN})."
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.has_token == 'true'

      - uses: actions/setup-python@v5
        if: steps.token.outputs.has_token == 'true'
        with:
          python-version: "3.11"

      - name: Install systems-first package
        if: steps.token.outputs.has_token == 'true'
        run: pip install "systems-first @ git+https://x-access-token:${{ secrets.PHOTONFORGE_READ_TOKEN }}@github.com/Ajam1997/PHOTONFORGE@v0.2.1#subdirectory=packages/systems-first"

      - name: Publish wiki
        if: steps.token.outputs.has_token == 'true'
        env:
          WIKI_PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: sf-wiki --push
