name: Export SysMLv2 Model

# Auto-regenerates model/system.sysml from requirements/requirement-map.yml
# (and live Issue bodies) on push to main, and commits the result.
#
# Optional — disable by deleting this file or commenting out the `on:`
# triggers. The CLI is also runnable manually:
#   sf-sysml
#
# See dev-docs/architecture/sysml-export.md for the YAML → SysMLv2 mapping.

on:
  push:
    branches: [main]
    paths:
      - "requirements/requirement-map.yml"
      - ".github/workflows/sysml-export.yml"
  workflow_run:
    workflows: ["PR — Roll Up Issue Status"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sysml-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      issues: read

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REGEN_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install systems-first package
        run: pip install "systems-first @ git+https://x-access-token:${{ secrets.PHOTONFORGE_READ_TOKEN }}@github.com/Ajam1997/PHOTONFORGE@v0.1.0#subdirectory=packages/systems-first"

      - name: Export SysMLv2 model
        env:
          GITHUB_TOKEN: ${{ secrets.REGEN_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: sf-sysml

      - name: Commit regenerated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model/system.sysml
          git diff --staged --quiet || git commit -m "model: auto-regenerate system.sysml [skip ci]"
          git push
