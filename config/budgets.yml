# config/budgets.yml — Tracked resource budgets
#
# Cross-cutting resources that get *allocated* down the requirement
# tree. Each budget has a top-level cap and a list of allocations to
# subsystems / requirements. The V&V matrix flags any allocation
# that exceeds its cap; the dashboard surfaces margin remaining.
#
# Budgets are NOT requirements. They're a separate bookkeeping layer
# that informs the FRs/NFRs. An NFR like "RSS ≤ 1.5 GB" is the
# *contract*; the budget shows where the 1.5 GB is spent.
#
# Schema:
#   budgets:
#     <budget-name>:
#       unit: <unit>
#       cap: <top-level number>
#       margin_target: <reserved fraction, 0.0-1.0>
#       allocations:
#         - to: <subsystem-or-requirement-id>
#           value: <number>
#           note: <optional context>
#
# UNCOMMENT the budgets that matter for your project; delete the others.

# ============================================================================
# PROFILE A — Pure software (memory + CPU + latency are typical)
# ============================================================================
budgets:
  memory_rss:
    unit: GB
    cap: 1.5
    margin_target: 0.10   # keep 10% margin (150 MB headroom)
    allocations: []      # populate as subsystems land

  cpu_peak:
    unit: percent_of_cores
    cap: 80
    margin_target: 0.10
    allocations: []

  inference_latency:
    unit: seconds_per_image
    cap: 2.5
    margin_target: 0.20
    allocations: []

