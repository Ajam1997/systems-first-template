# config/disciplines.yml — Active discipline-lead agents
#
# Which discipline-lead agents are active for THIS project. Edit at
# project start; revisit when a new discipline enters scope.
#
# Each active discipline must have a corresponding agent file in
# .claude/agents/ (typically copied or symlinked from .claude/agent-packs/).
#
# Three universal agents are always active and not listed here:
#   - @systemmaster (operator-only cross-cutting review)
#   - @verification (per-commit verification cycle)
#   - @validation   (per-milestone E2E validation)
#
# Schema:
#   disciplines:
#     - name: <discipline-lead-name>      # matches .claude/agents/<name>.md
#       active: true | false
#       evidence_kinds: [<list>]          # subset of config/evidence-kinds.yml
#       responsible_for: <one-line scope>
#
# Three worked-example profiles below. UNCOMMENT the one that fits;
# delete the others or keep them as reference.

# ============================================================================
# PROFILE A — Pure software project
# ============================================================================
disciplines:
  - name: systems_lead
    active: true
    evidence_kinds: [review, inspection]
    responsible_for: requirements tree, architecture, interfaces, budgets

  - name: software_lead
    active: true
    evidence_kinds: [pytest, unittest, e2e, kpm, inspection]
    responsible_for: src/, tests/, software performance KPMs

