name: Validate Artifact Manifests

# Runs sf-artifacts (from the systems-first package) on PRs that touch
# artifacts/ to catch missing required fields, broken snapshot pointers,
# malformed sha256 hashes, and stale linked_requirements references.
#
# Errors fail the workflow (PR cannot merge until clean).
# Warnings are surfaced in the log but don't block.

on:
  pull_request:
    paths:
      - "artifacts/**"
      - "dev-docs/architecture/artifact-manifest.md"
      - ".github/workflows/validate-artifacts.yml"
      - "requirements/requirement-map.yml"
      - "config/disciplines.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install systems-first package
        run: pip install "systems-first @ git+https://x-access-token:${{ secrets.PHOTONFORGE_READ_TOKEN }}@github.com/Ajam1997/PHOTONFORGE@v0.2.1#subdirectory=packages/systems-first"

      - name: Validate all artifact manifests
        run: sf-artifacts --verbose
